name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 1 * *" # monthly

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  setup:
    name: Setup
    permissions:
      contents: read # checkout
    strategy:
      matrix:
        runner:
          - ubuntu-24.04-arm
          - ubicloud-standard-4-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup

  checks:
    name: Checks
    needs: setup
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          rust: "true"

      - name: Run checks
        run: ./scripts/checks.nu

  compatibility:
    name: Compatibility
    needs: setup
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          rust: "true"

      - name: Build
        run: ./scripts/compatibility.nu

  # NOTE: Codecov uploads are failing.
  # https://github.com/codecov/umbrella/issues/616
  # coverage:
  #   name: Coverage
  #   needs: setup
  #   runs-on: ubuntu-24.04-arm
  #   permissions:
  #     contents: read # checkout
  #     id-token: write # codecov
  #   steps:
  #     - name: Checkout
  #       uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #       with:
  #         fetch-depth: 0
  #         persist-credentials: false
  #
  #     - name: Setup
  #       uses: ./.github/actions/setup
  #       with:
  #         rust: "true"
  #
  #     - name: Generate coverage
  #       run: ./scripts/ci/coverage.nu
  #
  #     - name: Upload coverage to Codecov
  #       uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
  #       with:
  #         files: codecov.json
  #         fail_ci_if_error: true
  #         use_oidc: true

  docs:
    name: Docs
    needs: setup
    runs-on: ubuntu-24.04-arm
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read # checkout
      pages: write # pages
      id-token: write # pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          rust: "true"

      - name: Build docs
        run: ./scripts/ci/docs.nu

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  fuzz:
    name: Fuzz
    needs: setup
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read # checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          rust: "true"

      - name: Run fuzzing
        run: ./scripts/fuzz.nu

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts

  benches:
    name: Benchmarks
    needs: setup
    runs-on: ubicloud-standard-4-arm
    permissions:
      contents: read # checkout
      id-token: write # codspeed
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        uses: $/.github/actions/setup
        with:
          rust: "true"

      - name: Build benchmarks
        run: ./scripts/ci/bench-build.nu

      - name: Run benchmarks
        uses: CodSpeedHQ/action@c4fd08a3a159bd0cc208da1e0edf32b8c47d75e5 # v5.4.0
        with:
          mode: simulation,memory
          cycle-estimation: true
          exclude-allocations: true
          run: ./scripts/ci/bench-run.nu
